name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.26.x
          - os: macos-latest
            go: 1.26.x
          - os: windows-latest
            go: 1.26.x
          - os: ubuntu-latest
            go: 1.22.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - if: runner.os != 'Windows' && matrix.go == '1.26.x'
        run: sh test/install.sh
